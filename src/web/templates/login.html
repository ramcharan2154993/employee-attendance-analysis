<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in · {{ APP_NAME }}</title>
    <meta name="description" content="{{ APP_NAME }} · {{ APP_TAGLINE }}">
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="login-body">
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">
                    <svg class="app-logo-mark" width="44" height="44" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <defs>
                            <linearGradient id="loginLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#2563eb" />
                                <stop offset="100%" stop-color="#3b82f6" />
                            </linearGradient>
                        </defs>
                        <rect width="34" height="34" rx="10" fill="url(#loginLogoGrad)" />
                        <path d="M10 17.5L15 22.5L24 12.5" stroke="#ffffff" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                </div>
                <h1 class="login-title">Sign in to {{ APP_NAME }}</h1>
                <p class="login-subtitle">{{ APP_TAGLINE }}</p>
            </div>

            {% if error %}
            <div class="alert alert-danger login-error" role="alert">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/login" method="POST" class="login-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="next" value="{{ next }}">

                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" value="{{ username or '' }}" required autofocus autocomplete="username" placeholder="Enter your username">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Enter your password">
                </div>

                <div class="form-group" style="margin-top: 8px;">
                    <button type="submit" class="btn btn-primary login-btn">
                        Sign In
                    </button>
                </div>
            </form>

            <div class="login-footer">
                <span>Restricted access &bull; Authorized personnel only</span>
            </div>
        </div>
    </div>
</body>
</html>
