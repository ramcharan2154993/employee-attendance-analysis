{% extends "base.html" %}

{% block title %}{{ title }} - Employee Attendance Analysis System{% endblock %}

{% block content %}
<div class="card">
    <h1>{{ title }}</h1>
    {% if error %}
    <p style="color: var(--danger); font-weight: 500;">{{ error }}</p>
    {% endif %}
    <form action="{{ form_action }}" method="post" style="display: flex; flex-direction: column; gap: 1rem; max-width: 480px;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label for="employee_code" style="display: block; margin-bottom: 0.25rem;">Employee Code:</label>
            <input type="text" id="employee_code" name="employee_code" value="{{ employee_code }}" required style="width: 100%;">
        </div>
        <div>
            <label for="attendance_date" style="display: block; margin-bottom: 0.25rem;">Attendance Date:</label>
            <input type="date" id="attendance_date" name="attendance_date" value="{{ attendance_date }}" required style="width: 100%;">
        </div>
        <div>
            <label for="status" style="display: block; margin-bottom: 0.25rem;">Status:</label>
            <select id="status" name="status" style="width: 100%;">
                {% for st in valid_statuses %}
                <option value="{{ st }}"{% if st == status %} selected{% endif %}>{{ st }}</option>
                {% endfor %}
            </select>
        </div>
        <div style="display: flex; gap: 1rem; align-items: center; margin-top: 0.5rem;">
            <button type="submit">Submit</button>
            <a href="/attendance" style="color: var(--text-muted); text-decoration: none;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
