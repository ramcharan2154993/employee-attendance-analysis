{% extends "base.html" %}

{% block title %}{{ title }} - Employee Attendance Analysis System{% endblock %}

{% block content %}
<div class="card">
    <h1>{{ title }}</h1>
    {% if error %}
    <p style="color: var(--danger); font-weight: 500;">{{ error }}</p>
    {% endif %}
    <form action="{{ form_action }}" method="post" style="display: flex; flex-direction: column; gap: 1rem; max-width: 480px;">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div>
            <label for="employee_code" style="display: block; margin-bottom: 0.25rem;">Employee Code:</label>
            {% if is_edit %}
            <input type="text" id="employee_code" name="employee_code" value="{{ code }}" readonly style="width: 100%; opacity: 0.7;">
            {% else %}
            <input type="text" id="employee_code" name="employee_code" value="{{ code }}" required style="width: 100%;">
            {% endif %}
        </div>
        <div>
            <label for="employee_name" style="display: block; margin-bottom: 0.25rem;">Employee Name:</label>
            <input type="text" id="employee_name" name="employee_name" value="{{ name }}" style="width: 100%;">
        </div>
        <div>
            <label for="department" style="display: block; margin-bottom: 0.25rem;">Department:</label>
            <input type="text" id="department" name="department" value="{{ department }}" style="width: 100%;">
        </div>
        <div style="display: flex; gap: 1rem; align-items: center; margin-top: 0.5rem;">
            <button type="submit">Save</button>
            <a href="/employees" style="color: var(--text-muted); text-decoration: none;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
